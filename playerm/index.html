<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Ashi X Miku — Music Player</title>
<meta name="description" content="Ashi X Miku — cari dan dengarkan lagu langsung dari browser. Player dengan latar dinamis mengikuti artwork lagu, tanpa perlu akun." />
<meta name="theme-color" content="#0a0c0f" />

<!-- Open Graph -->
<meta property="og:title" content="Ashi X Miku — Music Player" />
<meta property="og:description" content="Cari lagu, dengarkan langsung, dan nikmati player dengan latar dinamis mengikuti warna artwork." />
<meta property="og:image" content="./assets/favicon.svg" />
<meta property="og:type" content="website" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Ashi X Miku — Music Player" />
<meta name="twitter:description" content="Cari lagu, dengarkan langsung, dan nikmati player dengan latar dinamis mengikuti warna artwork." />
<meta name="twitter:image" content="./assets/favicon.svg" />

<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
<link rel="apple-touch-icon" href="./assets/favicon.svg" />
<link rel="manifest" href="./manifest.json" />
<meta name="apple-mobile-web-app-title" content="Ashi X Miku" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="./style.css" />
</head>
<body>

<!-- Dynamic crossfading background -->
<div class="bg-stage" aria-hidden="true">
  <div class="background-layer layer-a"></div>
  <div class="background-layer layer-b"></div>
  <div class="bg-noise"></div>
</div>

<div class="app">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <svg class="brand-mark" width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="13" cy="13" r="12" stroke="currentColor" stroke-width="1.6"/>
          <path d="M9 8.5v9l8-4.5-8-4.5z" fill="currentColor"/>
        </svg>
        <span class="brand-name">Ashi<span class="brand-accent"> X Miku</span></span>
      </div>
      <button class="menu-btn" id="menuBtn" aria-label="Buka menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>

    <div class="search-row">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="search-icon"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="text" inputmode="search" placeholder="Cari lagu, artis, atau album..." autocomplete="off" aria-label="Cari musik" />
        <button id="clearSearch" class="clear-btn" aria-label="Hapus pencarian" hidden>✕</button>
      </div>
    </div>
  </header>

  <!-- SIDE MENU -->
  <nav class="side-menu" id="sideMenu" aria-hidden="true">
    <button class="tab active" data-tab="search">Pencarian</button>
    <button class="tab" data-tab="recent">Baru Diputar</button>
    <button class="tab" data-tab="favorites">Favorit</button>
    <button class="tab" data-tab="queue">Antrean</button>
  </nav>
  <div class="scrim" id="scrim"></div>

  <!-- MAIN CONTENT -->
  <main class="content" id="content">

    <section class="panel" data-panel="search">
      <div id="searchStatus" class="status-line" hidden></div>
      <div id="searchResults" class="song-grid"></div>
    </section>

    <section class="panel" data-panel="recent" hidden>
      <div class="panel-head">
        <h2>Baru Diputar</h2>
      </div>
      <div id="recentResults" class="song-grid"></div>
    </section>

    <section class="panel" data-panel="favorites" hidden>
      <div class="panel-head">
        <h2>Favorit</h2>
      </div>
      <div id="favoriteResults" class="song-grid"></div>
    </section>

    <section class="panel" data-panel="queue" hidden>
      <div class="panel-head">
        <h2>Antrean Putar</h2>
        <button id="shuffleQueueBtn" class="ghost-btn">Acak</button>
      </div>
      <div id="queueList" class="queue-list"></div>
    </section>

  </main>
</div>

<!-- MINI PLAYER (collapsed bar) -->
<button class="mini-player" id="miniPlayer" hidden aria-label="Buka player penuh">
  <img id="miniCover" class="mini-cover" alt="" />
  <div class="mini-info">
    <div id="miniTitle" class="mini-title">—</div>
    <div id="miniArtist" class="mini-artist">—</div>
  </div>
  <div class="mini-progress"><div id="miniProgressFill" class="mini-progress-fill"></div></div>
  <span class="mini-controls">
    <button id="miniPrev" class="mini-icon-btn" aria-label="Sebelumnya" onclick="event.stopPropagation()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM10 12l9-6v12z"/></svg>
    </button>
    <button id="miniPlayPause" class="mini-icon-btn primary" aria-label="Putar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="icon-play"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="miniNext" class="mini-icon-btn" aria-label="Berikutnya" onclick="event.stopPropagation()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM5 6l9 6-9 6z"/></svg>
    </button>
  </span>
</button>

<!-- FULL PLAYER -->
<section class="player" id="player" hidden aria-label="Pemutar musik">
  <div class="player-topbar">
    <button id="closePlayer" class="icon-btn" aria-label="Tutup player">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="player-topbar-label">Sedang Diputar</span>
    <button id="favBtn" class="icon-btn" aria-label="Tambah ke favorit" aria-pressed="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="heart-icon"><path d="M12 21s-7.5-4.9-10-9.3C.3 8.1 2 4.5 5.6 4c2-.3 3.8.7 6.4 3.4C14.6 4.7 16.4 3.7 18.4 4c3.6.5 5.3 4.1 3.6 7.7C19.5 16.1 12 21 12 21z" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
  </div>

  <div class="player-body">
    <div class="cover-wrap">
      <img id="cover" class="cover" alt="" />
    </div>

    <div class="track-meta">
      <h1 id="trackTitle" class="track-title">Pilih lagu untuk mulai</h1>
      <p id="trackArtist" class="track-artist">—</p>
    </div>

    <div class="progress-wrap">
      <input id="seekBar" class="seek-bar" type="range" min="0" max="1000" value="0" step="1" aria-label="Posisi lagu" />
      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div id="playerError" class="player-error" hidden></div>

    <div class="controls-row">
      <button id="shuffleBtn" class="ctrl-btn" aria-label="Acak" aria-pressed="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M17 3l4 4-4 4M3 17h4l10-14h4M3 7h4l3.5 5M17 21l4-4-4-4M7 21h4l1.7-2.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="prevBtn" class="ctrl-btn" aria-label="Lagu sebelumnya">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM10 12l9-6v12z"/></svg>
      </button>
      <button id="playPauseBtn" class="ctrl-btn play-btn" aria-label="Putar">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" class="icon-play"><path d="M8 5v14l11-7z"/></svg>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" class="icon-pause" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        <svg width="26" height="26" viewBox="0 0 24 24" class="icon-spin" hidden><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="42 100" fill="none"/></svg>
      </button>
      <button id="nextBtn" class="ctrl-btn" aria-label="Lagu berikutnya">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM5 6l9 6-9 6z"/></svg>
      </button>
      <button id="repeatBtn" class="ctrl-btn" aria-label="Ulangi" data-mode="off">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="repeat-one-dot" hidden>1</span>
      </button>
    </div>

    <div class="volume-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="vol-icon"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
      <input id="volumeBar" class="volume-bar" type="range" min="0" max="100" value="80" step="1" aria-label="Volume" />
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>
</section>

<script src="./app.js"></script>
</body>
</html>
