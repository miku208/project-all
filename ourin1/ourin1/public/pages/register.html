<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar — JadiBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="auth-shell">
    <main class="card auth-card fade-in">
      <div class="brand-row">
        <span class="brand-mark"><i class="fa-solid fa-bolt"></i></span>
        <span class="brand-name">Jadi<span class="accent">bot</span></span>
      </div>

      <h1>Buat akun baru</h1>
      <p class="sub">Gratis untuk mulai, satu nomor WhatsApp jadi bot.</p>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-row">
            <input id="email" type="email" placeholder="kamu@email.com" autocomplete="email" required />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-row">
            <input id="password" type="password" placeholder="Minimal 8 karakter" autocomplete="new-password" required />
            <button type="button" class="toggle-vis" data-toggle-for="password">Lihat</button>
          </div>
          <div class="pw-strength" id="pwStrength">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Konfirmasi Password</label>
          <div class="input-row">
            <input
              id="confirmPassword"
              type="password"
              placeholder="Ulangi password"
              autocomplete="new-password"
              required
            />
            <button type="button" class="toggle-vis" data-toggle-for="confirmPassword">Lihat</button>
          </div>
        </div>

        <p class="error-text" id="errorMsg"></p>

        <button type="submit" class="btn block" id="submitBtn">
          <span class="btn-label">Daftar</span>
        </button>
      </form>

      <p class="auth-foot">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
